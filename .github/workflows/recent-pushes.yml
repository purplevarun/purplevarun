name: update recent pushes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: render latest public pushes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "/users/purplevarun/events?per_page=30" --jq '
            [.[] | select(.type == "PushEvent")
              | {repo: .repo.name, n: (.payload.size // 1), at: (.created_at | .[:10])}]
            | unique_by(.repo, .at)
            | .[:8][]
            | "- `\(.n)` commit\(if .n == 1 then "" else "s" end) → [\(.repo)](https://github.com/\(.repo)) · \(.at)"
          ' > pushes.txt
          if [ ! -s pushes.txt ]; then
            echo "- nothing public lately — building in private" > pushes.txt
          fi
          python3 -c "
          import pathlib
          p = pathlib.Path('README.md')
          t = p.read_text()
          a, b = '<!--START_SECTION:pushes-->', '<!--END_SECTION:pushes-->'
          head, _, rest = t.partition(a)
          _, _, tail = rest.partition(b)
          n = pathlib.Path('pushes.txt').read_text().strip()
          p.write_text(head + a + '\n' + n + '\n' + b + tail)
          "
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || {
            git commit -m "chore: update recent pushes"
            git push
          }
